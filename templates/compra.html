{% extends 'index.html' %}

{% block content %}

<h2>Calculadora de Compra</h2>

<form method="POST">

    <div class="mb-3">
        <label>Cantidad</label>
        <input type="number" step="any" class="form-control" name="cantidad">
    </div>

    <div class="mb-3">
        <label>Precio Unitario</label>
        <input type="number" step="any" class="form-control" name="precio">
    </div>

    <button class="btn btn-primary">
        Calcular
    </button>

</form>

{% if resultado %}

<div class="resultado mt-4">

    <h4>Resultado</h4>

    <p>Subtotal: ${{ resultado.subtotal }}</p>

    <p>Descuento: ${{ resultado.descuento }}</p>

    <p>Total: ${{ resultado.total }}</p>

</div>

{% endif %}

{% endblock %}
