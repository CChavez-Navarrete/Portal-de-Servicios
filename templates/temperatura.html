{% extends 'index.html' %}

{% block content %}

<h2>Conversor de Temperatura</h2>

<form method="POST">

    <div class="mb-3">

        <label>Grados Celsius</label>

        <input
            type="number"
            step="any"
            class="form-control"
            name="celsius">

    </div>

    <button class="btn btn-primary">
        Convertir
    </button>

</form>

{% if resultado %}

<div class="resultado mt-4">

    <p>Celsius: {{ resultado.celsius }}</p>

    <p>Fahrenheit: {{ resultado.fahrenheit }}</p>

    <p>Kelvin: {{ resultado.kelvin }}</p>

</div>

{% endif %}

{% endblock %}
